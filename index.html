<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poranne przygotowanie do szkoły i przedszkola</title>
    <style>
        :root {
            --bg-color: #f0f7ff;
            --ala-color: #ff4081;
            --ala-bg: #fff0f5;
            --ola-color: #7c4dff;
            --ola-bg: #f3e8ff;
            --text-dark: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            padding: 20px 10px;
            display: flex;
            justify-content: center;
        }

        .main-wrapper {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 15px;
            color: #0f172a;
        }

        /* TOP BAR */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        .time-inputs {
            display: flex;
            gap: 10px;
        }

        .time-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 6px 12px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .time-box label {
            font-size: 0.65rem;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .time-box input {
            border: none;
            background: transparent;
            font-weight: 800;
            font-size: 0.95rem;
            color: #1e293b;
            outline: none;
            width: 60px;
        }

        .total-time-badge {
            background: #e0f2fe;
            color: #0284c7;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .btn-start {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 14px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.95rem;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            transition: transform 0.1s;
        }

        .btn-start:active { transform: scale(0.97); }

        /* MOUSE INFO BADGES */
        .controls-info {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .info-badge {
            flex: 1;
            text-align: center;
            padding: 8px;
            border-radius: 16px;
            font-size: 0.82rem;
            font-weight: 700;
        }

        .info-badge.ala {
            background: #fce7f3;
            color: #be185d;
        }

        .info-badge.ola {
            background: #f3e8ff;
            color: #6b21a8;
        }

        /* COLUMNS GRID */
        .columns-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 650px) {
            .columns-grid { grid-template-columns: 1fr 1fr; }
        }

        .child-card {
            border-radius: 20px;
            padding: 15px;
            border: 2px solid transparent;
        }

        .child-card.ala {
            border-color: #fbcfe8;
            background: #fff5f8;
        }

        .child-card.ola {
            border-color: #e9d5ff;
            background: #faf5ff;
        }

        .child-title {
            text-align: center;
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .child-card.ala .child-title { color: var(--ala-color); }
        .child-card.ola .child-title { color: var(--ola-color); }

        /* TASKS */
        .tasks-wrapper {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .task-row {
            background: white;
            border-radius: 14px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            cursor: pointer;
        }

        .task-icon {
            font-size: 1.6rem;
            width: 32px;
            text-align: center;
        }

        .task-details {
            flex: 1;
        }

        .task-top {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .task-time-val {
            color: #64748b;
            font-size: 0.75rem;
        }

        .progress-bar-bg {
            height: 8px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .child-card.ala .progress-bar-fill { background: var(--ala-color); }
        .child-card.ola .progress-bar-fill { background: var(--ola-color); }

        .task-row.completed .progress-bar-fill {
            width: 100% !important;
        }

        /* STICKER ALBUM */
        .album-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            font-weight: 700;
            color: #64748b;
            margin-bottom: 8px;
        }

        .sticker-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
        }

        .sticker-slot {
            aspect-ratio: 1;
            background: #ffffff;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: #94a3b8;
            font-weight: bold;
        }

        .sticker-slot.filled {
            border: 1px solid #fde047;
            background: #fefce8;
            box-shadow: 0 0 5px rgba(253, 224, 71, 0.5);
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <h1>Poranne przygotowanie do szkoły i przedszkola</h1>

        <!-- TOP BAR -->
        <div class="top-bar">
            <div class="time-inputs">
                <div class="time-box">
                    <label>⏰ POBUDKA</label>
                    <input type="time" id="wake-time" value="06:30" onchange="calculateTotalTime()">
                </div>
                <div class="time-box">
                    <label>🏫 WYJŚCIE</label>
                    <input type="time" id="exit-time" value="07:20" onchange="calculateTotalTime()">
                </div>
            </div>

            <div class="total-time-badge" id="total-time-display">
                Czas ogółem: 50 min
            </div>

            <button class="btn-start" onclick="toggleTimer()">▶ Start Odliczania</button>
        </div>

        <!-- MOUSE INSTRUCTIONS -->
        <div class="controls-info">
            <div class="info-badge ala">🌸 Ala: Kliknięcie LPM (Lewy Przycisk Myszy)</div>
            <div class="info-badge ola">👑 Ola: Kliknięcie PPM (Prawy Przycisk Myszy)</div>
        </div>

        <!-- COLUMNS -->
        <div class="columns-grid">
            
            <!-- ALA -->
            <div class="child-card ala" id="card-ala">
                <div class="child-title">🌸 ALA</div>
                
                <div class="tasks-wrapper" id="tasks-ala"></div>

                <div class="album-header">
                    <span>🎨 Album naklejek Ali</span>
                    <span id="count-ala">0/20</span>
                </div>
                <div class="sticker-grid" id="stickers-ala"></div>
            </div>

            <!-- OLA -->
            <div class="child-card ola" id="card-ola">
                <div class="child-title">👑 OLA</div>

                <div class="tasks-wrapper" id="tasks-ola"></div>

                <div class="album-header">
                    <span>🎨 Album naklejek Oli</span>
                    <span id="count-ola">0/20</span>
                </div>
                <div class="sticker-grid" id="stickers-ola"></div>
            </div>

        </div>
    </div>

    <script>
        const TASKS = [
            { id: 0, name: "Ubieranie", time: 10, icon: "👕" },
            { id: 1, name: "Śniadanie", time: 15, icon: "🥣" },
            { id: 2, name: "Mycie zębów", time: 5, icon: "🦷" },
            { id: 3, name: "Pakowanie", time: 10, icon: "🎒" },
            { id: 4, name: "Buty i kurtka", time: 10, icon: "👟" }
        ];

        const REWARDS = ['🚀', '👑', '💎', '🦄', '⭐', '🎈', '🌸', '🍦'];

        let state = {
            ala: { tasks: [false, false, false, false, false], stickers: [] },
            ola: { tasks: [false, false, false, false, false], stickers: [] }
        };

        // Zabezpieczenie przed menu kontekstowym PPM w całej aplikacji
        document.addEventListener('contextmenu', e => e.preventDefault());

        function calculateTotalTime() {
            const wake = document.getElementById('wake-time').value.split(':').map(Number);
            const exit = document.getElementById('exit-time').value.split(':').map(Number);
            
            let wakeMins = wake[0] * 60 + wake[1];
            let exitMins = exit[0] * 60 + exit[1];
            
            let diff = exitMins - wakeMins;
            if (diff < 0) diff += 24 * 60;

            document.getElementById('total-time-display').innerText = `Czas ogółem: ${diff} min`;
        }

        function handleTaskClick(child, index) {
            state[child].tasks[index] = !state[child].tasks[index];

            // Jeśli wykonano wszystkie zadania, przyznaj naklejkę
            const allDone = state[child].tasks.every(t => t === true);
            if (allDone && state[child].stickers.length < 20) {
                const randomReward = REWARDS[Math.floor(Math.random() * REWARDS.length)];
                state[child].stickers.push(randomReward);
            }

            render();
        }

        function render() {
            ['ala', 'ola'].forEach(child => {
                const tasksContainer = document.getElementById(`tasks-${child}`);
                tasksContainer.innerHTML = '';

                TASKS.forEach((task, index) => {
                    const isDone = state[child].tasks[index];
                    const row = document.createElement('div');
                    row.className = `task-row ${isDone ? 'completed' : ''}`;
                    
                    // LPM dla Ali, PPM dla Oli
                    row.onmousedown = (e) => {
                        if (child === 'ala' && e.button === 0) { // LPM
                            handleTaskClick('ala', index);
                        } else if (child === 'ola' && e.button === 2) { // PPM
                            handleTaskClick('ola', index);
                        }
                    };

                    row.innerHTML = `
                        <div class="task-icon">${task.icon}</div>
                        <div class="task-details">
                            <div class="task-top">
                                <span>${task.name}</span>
                                <span class="task-time-val">${task.time} min</span>
                            </div>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width: ${isDone ? '100%' : '0%'}"></div>
                            </div>
                        </div>
                    `;
                    tasksContainer.appendChild(row);
                });

                // Renderowanie 20 kratek naklejek
                const stickerGrid = document.getElementById(`stickers-${child}`);
                stickerGrid.innerHTML = '';
                const collected = state[child].stickers;

                document.getElementById(`count-${child}`).innerText = `${collected.length}/20`;

                for (let i = 0; i < 20; i++) {
                    const slot = document.createElement('div');
                    if (i < collected.length) {
                        slot.className = 'sticker-slot filled';
                        slot.innerText = collected[i];
                    } else {
                        slot.className = 'sticker-slot';
                        slot.innerText = '?';
                    }
                    stickerGrid.appendChild(slot);
                }
            });
        }

        function toggleTimer() {
            alert("Odliczanie zostało rozpoczęte!");
        }

        calculateTotalTime();
        render();
    </script>
</body>
</html>
