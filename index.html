<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poranny Plan Dnia - Ala i Ola</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #fef3c7 100%);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --ala-color: #ec4899;
            --ala-bg: #fdf2f8;
            --ala-border: #f472b6;
            --ola-color: #8b5cf6;
            --ola-bg: #f5f3ff;
            --ola-border: #a78bfa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--text-main);
            padding: 15px 10px;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        h1 { color: var(--primary); font-size: 1.8rem; margin-bottom: 5px; }

        .global-clock {
            font-size: 1.6rem;
            font-weight: bold;
            color: #1e293b;
            background: #e0e7ff;
            display: inline-block;
            padding: 4px 18px;
            border-radius: 12px;
        }

        .legend {
            margin-top: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .grid { grid-template-columns: 1fr 1fr; }
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 18px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border: 3px solid transparent;
        }

        .card.ala { border-color: var(--ala-border); background: linear-gradient(to bottom, #ffffff, var(--ala-bg)); }
        .card.ola { border-color: var(--ola-border); background: linear-gradient(to bottom, #ffffff, var(--ola-bg)); }

        .child-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px dashed #cbd5e1;
        }

        .child-name { font-size: 1.5rem; font-weight: 700; }
        .card.ala .child-name { color: var(--ala-color); }
        .card.ola .child-name { color: var(--ola-color); }

        .time-panel {
            background: rgba(255, 255, 255, 0.85);
            padding: 10px 12px;
            border-radius: 14px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.88rem;
            font-weight: 600;
        }

        .time-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .time-row input {
            padding: 3px 8px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-weight: bold;
        }

        .task-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .task-item {
            background: white;
            padding: 10px 12px;
            border-radius: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            border: 2px solid #f1f5f9;
            cursor: pointer;
        }

        .task-item.active {
            border-color: #3b82f6;
            background: #eff6ff;
        }

        .task-item.completed {
            background: #f0fdf4;
            border-color: #86efac;
        }

        .task-main {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .task-checkbox {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: transparent;
        }

        .task-item.completed .task-checkbox {
            background: #22c55e;
            border-color: #22c55e;
            color: white;
        }

        .task-text { font-size: 0.95rem; font-weight: 600; flex: 1; }
        .task-item.completed .task-text { text-decoration: line-through; color: #94a3b8; }

        .task-timer-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-top: 5px;
            padding-top: 5px;
            border-top: 1px dashed #e2e8f0;
            color: var(--text-muted);
        }

        .countdown { font-weight: bold; color: #d97706; }
        .countdown.urgent { color: #dc2626; animation: pulse 1s infinite; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .sticker-album {
            margin-top: 15px;
            padding-top: 12px;
            border-top: 2px dashed #cbd5e1;
        }

        .sticker-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
        }

        .sticker-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .sticker-slot {
            aspect-ratio: 1;
            background: #f1f5f9;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .sticker-slot:active {
            transform: scale(0.95);
        }

        .sticker-slot.filled {
            background: #fef3c7;
            border: 2px solid #f59e0b;
        }

        .reset-btn {
            display: block;
            width: 100%;
            max-width: 250px;
            margin: 20px auto 0;
            padding: 10px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>☀️ Poranny Plan Dnia</h1>
            <div class="global-clock" id="clock">00:00:00</div>
            <div class="legend">🖱️ LPM = Wykonanie zadania / Dodanie naklejki | 🖱️ PPM = Usunięcie naklejki</div>
        </header>

        <div class="grid">
            <!-- ALA -->
            <div class="card ala">
                <div class="child-header">
                    <span class="child-name">Ala</span>
                    <div style="font-weight: bold; color: #d97706;" id="ala-status">Postęp: 0/5</div>
                </div>

                <div class="time-panel">
                    <div class="time-row">
                        <span>⏰ Pobudka:</span>
                        <input type="time" id="ala-wake-time" value="06:45" onchange="updateTimes()">
                    </div>
                    <div class="time-row">
                        <span>🚗 Wyjazd z domu:</span>
                        <input type="time" id="ala-target-time" value="07:30" onchange="updateTimes()">
                    </div>
                </div>

                <div class="task-list" id="ala-tasks"></div>

                <div class="sticker-album">
                    <div class="sticker-title">
                        <span>Kolekcja Naklejek (1 Dzień = 1 Naklejka)</span>
                        <span id="ala-sticker-count">0/7</span>
                    </div>
                    <div class="sticker-grid" id="ala-stickers"></div>
                </div>
            </div>

            <!-- OLA -->
            <div class="card ola">
                <div class="child-header">
                    <span class="child-name">Ola</span>
                    <div style="font-weight: bold; color: #d97706;" id="ola-status">Postęp: 0/5</div>
                </div>

                <div class="time-panel">
                    <div class="time-row">
                        <span>⏰ Pobudka:</span>
                        <input type="time" id="ola-wake-time" value="06:45" onchange="updateTimes()">
                    </div>
                    <div class="time-row">
                        <span>🚗 Wyjazd z domu:</span>
                        <input type="time" id="ola-target-time" value="07:30" onchange="updateTimes()">
                    </div>
                </div>

                <div class="task-list" id="ola-tasks"></div>

                <div class="sticker-album">
                    <div class="sticker-title">
                        <span>Kolekcja Naklejek (1 Dzień = 1 Naklejka)</span>
                        <span id="ola-sticker-count">0/7</span>
                    </div>
                    <div class="sticker-grid" id="ola-stickers"></div>
                </div>
            </div>
        </div>

        <button class="reset-btn" onclick="resetDay()">🔄 Rozpocznij nowy dzień</button>
    </div>

    <script>
        const TASK_DEFINITIONS = [
            { name: "🛏️ Ścielenie łóżka", duration: 5 },
            { name: "🦷 Mycie zębów", duration: 5 },
            { name: "👕 Ubranie się", duration: 10 },
            { name: "🥣 Zjedzenie śniadania", duration: 20 },
            { name: "👟 Załóż buty i kurtkę", duration: 5 }
        ];

        const STICKERS = ['🦄', '🌸', '🐱', '🌈', '🍦', '🎨', '👑', '🦋', '⭐', '🎈', '🦁', '🐼'];
        const TOTAL_SLOTS = 7;

        let state = {
            ala: { wakeTime: "06:45", targetTime: "07:30", tasks: [false, false, false, false, false], stickers: [] },
            ola: { wakeTime: "06:45", targetTime: "07:30", tasks: [false, false, false, false, false], stickers: [] }
        };

        function loadData() {
            const saved = localStorage.getItem('poranek_v5_data');
            if (saved) {
                state = JSON.parse(saved);
                document.getElementById('ala-wake-time').value = state.ala.wakeTime || "06:45";
                document.getElementById('ala-target-time').value = state.ala.targetTime || "07:30";
                document.getElementById('ola-wake-time').value = state.ola.wakeTime || "06:45";
                document.getElementById('ola-target-time').value = state.ola.targetTime || "07:30";
            }
        }

        function saveData() {
            state.ala.wakeTime = document.getElementById('ala-wake-time').value;
            state.ala.targetTime = document.getElementById('ala-target-time').value;
            state.ola.wakeTime = document.getElementById('ola-wake-time').value;
            state.ola.targetTime = document.getElementById('ola-target-time').value;
            localStorage.setItem('poranek_v5_data', JSON.stringify(state));
        }

        function updateTimes() {
            saveData();
            render();
        }

        function handleTaskClick(child, index) {
            state[child].tasks[index] = !state[child].tasks[index];
            
            const allCompleted = state[child].tasks.every(t => t === true);
            if (allCompleted && state[child].stickers.length < TOTAL_SLOTS) {
                const randomSticker = STICKERS[Math.floor(Math.random() * STICKERS.length)];
                state[child].stickers.push(randomSticker);
            }

            saveData();
            render();
        }

        function handleStickerLPM(child, slotIndex) {
            if (slotIndex >= state[child].stickers.length && state[child].stickers.length < TOTAL_SLOTS) {
                const randomSticker = STICKERS[Math.floor(Math.random() * STICKERS.length)];
                state[child].stickers.push(randomSticker);
                saveData();
                render();
            }
        }

        function handleStickerPPM(event, child, slotIndex) {
            event.preventDefault();
            if (slotIndex < state[child].stickers.length) {
                state[child].stickers.splice(slotIndex, 1);
                saveData();
                render();
            }
        }

        function resetDay() {
            if (confirm("Rozpocząć nowy dzień? Zadania zostaną wyczyszczone, naklejki pozostaną.")) {
                state.ala.tasks = [false, false, false, false, false];
                state.ola.tasks = [false, false, false, false, false];
                saveData();
                render();
            }
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString();
            renderTimers();
        }

        function getTaskSchedule(wakeTimeStr) {
            const [hours, minutes] = wakeTimeStr.split(':').map(Number);
            let currentTime = new Date();
            currentTime.setHours(hours, minutes, 0, 0);

            return TASK_DEFINITIONS.map(task => {
                const start = new Date(currentTime);
                const end = new Date(start.getTime() + task.duration * 60000);
                currentTime = end;
                return { name: task.name, start, end };
            });
        }

        function render() {
            ['ala', 'ola'].forEach(child => {
                const wakeStr = document.getElementById(`${child}-wake-time`).value;
                const schedule = getTaskSchedule(wakeStr);
                const container = document.getElementById(`${child}-tasks`);
                container.innerHTML = '';

                let completedCount = 0;

                schedule.forEach((item, index) => {
                    const isDone = state[child].tasks[index];
                    if (isDone) completedCount++;

                    const startStr = item.start.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    const endStr = item.end.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                    const li = document.createElement('li');
                    li.className = `task-item ${isDone ? 'completed' : ''}`;
                    li.id = `${child}-task-${index}`;
                    li.onclick = () => handleTaskClick(child, index);

                    li.innerHTML = `
                        <div class="task-main">
                            <div class="task-checkbox">${isDone ? '✓' : ''}</div>
                            <span class="task-text">${item.name}</span>
                        </div>
                        <div class="task-timer-info">
                            <span>⏰ ${startStr} - ${endStr}</span>
                            <span class="countdown" id="${child}-timer-${index}">--:--</span>
                        </div>
                    `;
                    container.appendChild(li);
                });

                const statusEl = document.getElementById(`${child}-status`);
                if (completedCount === 5) {
                    statusEl.innerText = "Dzień zaliczony! 🎉";
                    statusEl.style.color = "#22c55e";
                } else {
                    statusEl.innerText = `Postęp: ${completedCount}/5`;
                    statusEl.style.color = "#d97706";
                }

                const stickerGrid = document.getElementById(`${child}-stickers`);
                stickerGrid.innerHTML = '';
                const collected = state[child].stickers;

                document.getElementById(`${child}-sticker-count`).innerText = `${collected.length}/${TOTAL_SLOTS}`;

                for (let i = 0; i < TOTAL_SLOTS; i++) {
                    const slot = document.createElement('div');
                    if (i < collected.length) {
                        slot.className = 'sticker-slot filled';
                        slot.innerText = collected[i];
                    } else {
                        slot.className = 'sticker-slot';
                    }

                    slot.onclick = () => handleStickerLPM(child, i);
                    slot.oncontextmenu = (e) => handleStickerPPM(e, child, i);

                    stickerGrid.appendChild(slot);
                }
            });

            renderTimers();
        }

        function renderTimers() {
            const now = new Date();

            ['ala', 'ola'].forEach(child => {
                const wakeStr = document.getElementById(`${child}-wake-time`).value;
                const schedule = getTaskSchedule(wakeStr);

                schedule.forEach((item, index) => {
                    const timerEl = document.getElementById(`${child}-timer-${index}`);
                    const taskEl = document.getElementById(`${child}-task-${index}`);
                    if (!timerEl) return;

                    const isDone = state[child].tasks[index];

                    if (isDone) {
                        timerEl.innerText = "Zrobione!";
                        timerEl.className = "countdown";
                        if (taskEl) taskEl.classList.remove('active');
                    } else if (now > item.end) {
                        timerEl.innerText = "Spóźnienie!";
                        timerEl.className = "countdown urgent";
                        if (taskEl) taskEl.classList.remove('active');
                    } else if (now >= item.start && now <= item.end) {
                        const diffMs = item.end - now;
                        const mins = Math.floor(diffMs / 60000);
                        const secs = Math.floor((diffMs % 60000) / 1000);
                        timerEl.innerText = `Zostało: ${mins}m ${secs}s`;
                        timerEl.className = "countdown urgent";
                        if (taskEl) taskEl.classList.add('active');
                    } else {
                        const diffMs = item.start - now;
                        const mins = Math.floor(diffMs / 60000);
                        timerEl.innerText = `Za ${mins} min`;
                        timerEl.className = "countdown";
                        if (taskEl) taskEl.classList.remove('active');
                    }
                });
            });
        }

        loadData();
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
